name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Methodology + Phase 1–7 desk tests
        env:
          AUTH_ENABLED: "false"
          SECRET_KEY: ci-test-secret-key-32chars-min!!
          MARKET_DATA_ADAPTER: live
          LIVE_QUOTE_STALE_SEC: "5"
          BIND_HOST: "127.0.0.1"
          ALLOW_PUBLIC_BIND: "false"
          EOD_INGEST_SCHEDULE_ENABLED: "false"
        run: |
          python -c "from app.signals.methodology import score_evidence; assert score_evidence({})['direction']=='none'"
          python test_methodology.py
          python test_phase1_market.py
          python test_phase2_kotak_feed.py
          python test_phase2_provider.py
          python test_phase3_bars.py
          python test_phase3_option_chain.py
          python test_phase4_eod.py
          python test_phase4_chart.py
          python test_phase5_mcx.py
          python test_phase5_expectancy.py
          python test_phase6_chart.py
          python test_phase7_ops.py
          python test_options_oi.py
          python test_trade_ledger.py
          python test_position_sizing.py
          python test_market_events.py
          python test_strategy_evaluation.py
          python test_crypto_adapters.py
          python test_mvp_platform.py
          python test_analyze_validation.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Test
        env:
          CI: "true"
        run: npm test -- --watchAll=false
      - name: Build
        run: npm run build
